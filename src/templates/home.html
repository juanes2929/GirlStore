<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GirlStore | Maquillaje & Cosméticos</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/maquillaje.png') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- HEADER -->
  <header id="header">
    <div class="logo">GirlStore</div>
    <nav>
      <a href="#hero" class="nav-link">Inicio</a>
      <a href="#trendy" class="nav-link">Trendy</a>
      <a href="#montoc" class="nav-link">Montoc</a>
      <a href="#milagros" class="nav-link">Milagros</a>
      <a href="#" class="nav-link">Iniciar Sesión</a>
    </nav>
    <button class="cart-btn" id="cart-btn"><i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">0</span> Carrito</button>
  </header>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <h1>Descubre tu Belleza</h1>
      <p>Maquillaje, estilo y confianza en un solo lugar. Vive la experiencia GirlStore.</p>
      <button onclick="smoothScrollTo('#trendy')">Comenzar</button>
    </div>
  </section>

  <!-- TRENDY -->
  <section id="trendy" data-animate>
    <h2>Trendy</h2>
    <div class="products"></div>
  </section>

  <!-- MONTOC -->
  <section id="montoc" data-animate>
    <h2>Montoc</h2>
    <div class="products"></div>
  </section>

  <!-- MILAGROS -->
  <section id="milagros" data-animate>
    <h2>Milagros</h2>
    <div class="products"></div>
  </section>

  <!-- CARRITO -->
  <div id="cart-modal">
    <div class="cart-content">
      <h2>Tu Carrito</h2>
      <ul id="cart-items"></ul>
      <p id="total">Total: COP $0</p>
      <div class="cart-actions">
        <button id="buy-btn">Comprar</button>
        <button id="clear-cart">Vaciar</button>
        <button id="close-cart">Cerrar</button>
      </div>
    </div>
  </div>

  <footer>
    © 2025 GirlStore. Todos los derechos reservados.
  </footer>

  <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
