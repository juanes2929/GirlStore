<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GirlStore | Maquillaje & Cosméticos</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/maquillaje.png') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- HEADER -->
  <header id="header">
    <div class="logo">GirlStore</div>
    <nav>
      <a href="{{url_for('home')}}">Inicio</a>

    </nav>
    <button class="cart-btn" id="cart-btn"><i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">0</span> Carrito</button>
  </header>

    <section id="Login">
    <div class="login-wrapper">
        <div class="login-card" data-animate>
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Bienvenida de nuevo a <strong>GirlStore</strong></p>

          <form id="loginForm" action="{{ url_for('login') }}" method="POST" class="login-form">

            <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required autofocus >
            </div>

            <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>

            <p class="register-text">
            ¿No tienes cuenta?
                <a href="{{ url_for('registro') }}">Regístrate aquí</a>
            </p>
        </form>
        </div>
    </div>
    </section>


  <footer>
    © 2025 GirlStore. Todos los derechos reservados.
  </footer>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
